# =============================================================================
# pfSense Firewall Rules - SOC Home Lab
# =============================================================================
# Network Segmentation:
#   CORP VLAN (10):    10.0.0.0/24 - Corporate endpoints
#   SOC_MGMT VLAN (20): 10.0.1.0/24 - Security infrastructure
#   ATTACKER VLAN (30): 10.0.2.0/24 - Attack simulation (isolated)
# Last Updated: 2025-01-15
# =============================================================================

# ---- WAN Interface Rules ----
# Default deny all inbound; allow outbound established
block in quick on $WAN all
pass in quick on $WAN proto tcp from any to any flags A/A
pass out quick on $WAN from any to any keep state

# ---- CORP VLAN (10) Rules ----
# Allow internal CORP communication
pass in quick on $CORP_VLAN from 10.0.0.0/24 to 10.0.0.0/24 keep state

# Allow CORP endpoints to forward logs to Wazuh Manager
pass in quick on $CORP_VLAN proto tcp from 10.0.0.0/24 to 10.0.1.10 port { 1514, 1515 } keep state

# Allow CORP to access internet (HTTP, HTTPS, DNS)
pass in quick on $CORP_VLAN proto tcp from 10.0.0.0/24 to any port { 80, 443 } keep state
pass in quick on $CORP_VLAN proto udp from 10.0.0.0/24 to any port 53 keep state
pass in quick on $CORP_VLAN proto tcp from 10.0.0.0/24 to any port 53 keep state

# Block CORP from directly accessing ATTACKER VLAN
block in quick on $CORP_VLAN from 10.0.0.0/24 to 10.0.2.0/24 log

# ---- SOC_MGMT VLAN (20) Rules ----
# Allow all traffic within SOC MGMT (monitoring infrastructure)
pass in quick on $SOC_VLAN from 10.0.1.0/24 to 10.0.1.0/24 keep state

# Allow SOC MGMT to monitor all VLANs (full visibility)
pass in quick on $SOC_VLAN from 10.0.1.0/24 to 10.0.0.0/24 keep state
pass in quick on $SOC_VLAN from 10.0.1.0/24 to 10.0.2.0/24 keep state

# Allow SOC internet access for updates and threat intel feeds
pass in quick on $SOC_VLAN proto tcp from 10.0.1.0/24 to any port { 80, 443 } keep state
pass in quick on $SOC_VLAN proto udp from 10.0.1.0/24 to any port 53 keep state

# ---- ATTACKER VLAN (30) Rules ----
# Allow ATTACKER to reach CORP (controlled attack simulation)
pass in quick on $ATK_VLAN from 10.0.2.0/24 to 10.0.0.0/24 keep state

# Block ATTACKER from reaching SOC MGMT directly (protect monitoring)
block in quick on $ATK_VLAN from 10.0.2.0/24 to 10.0.1.0/24 log

# Allow limited internet for ATTACKER (tool downloads)
pass in quick on $ATK_VLAN proto tcp from 10.0.2.0/24 to any port { 80, 443 } keep state
pass in quick on $ATK_VLAN proto udp from 10.0.2.0/24 to any port 53 keep state

# ---- NAT Rules ----
nat on $WAN from 10.0.0.0/24 to any -> ($WAN)
nat on $WAN from 10.0.1.0/24 to any -> ($WAN)
nat on $WAN from 10.0.2.0/24 to any -> ($WAN)

# ---- Logging ----
# Log all blocked traffic for SOC analysis
block log all
