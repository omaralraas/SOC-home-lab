# =============================================================================
# pfSense Firewall Policy - SOC Home Lab
# =============================================================================
# The reviewed policy, written in pf syntax for readability and diffing.
# pfSense is configured through Firewall > Rules / Aliases; recreate these
# rules there in this order (first match wins, default deny).
#
#   CORP      10.0.0.0/24  corporate endpoints (monitored)
#   SOC_MGMT  10.0.1.0/24  Wazuh 10.0.1.10, Elastic 10.0.1.11, Suricata 10.0.1.12
#   ATTACKER  10.0.2.0/24  Kali, attack simulation only
# =============================================================================

table <soc_wazuh>    { 10.0.1.10 }
table <soc_elastic>  { 10.0.1.11 }
# URL Table alias refreshed every minute from the SOAR engine
# (http://10.0.1.10:5000/blocklist.txt); entries expire after block_ttl_seconds.
table <SOAR_BLOCKLIST> persist

# ---- Default deny, log everything blocked for the SIEM ----------------------
block log all

# ---- SOAR automated containment (evaluated first on every interface) --------
block in quick log on $WAN       from <SOAR_BLOCKLIST> to any
block in quick log on $ATK_VLAN  from <SOAR_BLOCKLIST> to any
block in quick log on $CORP_VLAN from any to <SOAR_BLOCKLIST>

# ---- WAN ----------------------------------------------------------------------
# Nothing inbound. Return traffic is handled by state, so no stateless
# "flags A/A" pass rule (that would let ACK scans and crafted segments through).
block in quick log on $WAN all
pass out on $WAN all keep state

# ---- CORP VLAN ----------------------------------------------------------------
# Telemetry to the SOC
pass in quick on $CORP_VLAN proto tcp from 10.0.0.0/24 to <soc_wazuh>   port { 1514 1515 } keep state  # Wazuh agent / enrollment
pass in quick on $CORP_VLAN proto tcp from 10.0.0.0/24 to <soc_elastic> port { 5044 5045 }   keep state  # Filebeat / Winlogbeat
# Internet for updates
pass in quick on $CORP_VLAN proto { tcp udp } from 10.0.0.0/24 to any port 53        keep state
pass in quick on $CORP_VLAN proto tcp        from 10.0.0.0/24 to any port { 80 443 } keep state
# Workstations never initiate connections into the attacker or SOC networks
block in quick log on $CORP_VLAN from 10.0.0.0/24 to { 10.0.1.0/24 10.0.2.0/24 }

# ---- SOC_MGMT VLAN ------------------------------------------------------------
pass in quick on $SOC_VLAN from 10.0.1.0/24 to 10.0.1.0/24 keep state
# Analysts and active response reach monitored hosts
pass in quick on $SOC_VLAN from 10.0.1.0/24 to 10.0.0.0/24 keep state
# Updates, rule feeds (ET Open, Wazuh CTI, GeoIP) and threat-intel APIs
pass in quick on $SOC_VLAN proto { tcp udp } from 10.0.1.0/24 to any port 53        keep state
pass in quick on $SOC_VLAN proto tcp        from 10.0.1.0/24 to any port { 80 443 } keep state
# The SOC never talks to the attacker VLAN
block in quick log on $SOC_VLAN from 10.0.1.0/24 to 10.0.2.0/24

# ---- ATTACKER VLAN ------------------------------------------------------------
# Simulations target the corporate VLAN only
pass in quick on $ATK_VLAN from 10.0.2.0/24 to 10.0.0.0/24 keep state
block in quick log on $ATK_VLAN from 10.0.2.0/24 to 10.0.1.0/24
pass in quick on $ATK_VLAN proto { tcp udp } from 10.0.2.0/24 to any port 53        keep state
pass in quick on $ATK_VLAN proto tcp        from 10.0.2.0/24 to any port { 80 443 } keep state

# ---- Firewall's own logs --------------------------------------------------------
# pfSense remote syslog (Status > System Logs > Settings) originates from the
# firewall itself: 10.0.1.1 -> 10.0.1.10:514/udp (Wazuh) and 10.0.1.11:5514/udp (Logstash).
pass out quick on $SOC_VLAN proto udp from 10.0.1.1 to <soc_wazuh>   port 514  keep state
pass out quick on $SOC_VLAN proto udp from 10.0.1.1 to <soc_elastic> port 5514 keep state

# ---- NAT ------------------------------------------------------------------------
nat on $WAN from { 10.0.0.0/24 10.0.1.0/24 10.0.2.0/24 } to any -> ($WAN)
