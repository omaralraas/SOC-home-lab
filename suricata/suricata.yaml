# SOC Home Lab - Suricata IDS Configuration
# Optimized for home lab network monitoring on SPAN port

%YAML 1.1
---

# Network variables
vars:
  address-groups:
    HOME_NET: "[10.0.0.0/24,10.0.1.0/24,10.0.2.0/24]"
    EXTERNAL_NET: "!$HOME_NET"
    HTTP_SERVERS: "[10.0.0.51]"
    DNS_SERVERS: "[10.0.0.1]"
    SMTP_SERVERS: "!any"

  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    SSH_PORTS: "22"
    DNS_PORTS: "53"

# Logging configuration
default-log-dir: /var/log/suricata/

outputs:
  # EVE JSON output (primary - sent to Logstash)
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      community-id: true
      community-id-seed: 0
      types:
        - alert:
            payload: yes
            payload-printable: yes
            packet: yes
            metadata: yes
            tagged-packets: yes
        - http:
            extended: yes
        - dns:
            enabled: yes
        - tls:
            extended: yes
        - files:
            force-magic: yes
            force-hash: [md5, sha256]
        - smtp:
            extended: yes
        - flow
        - netflow
        - anomaly:
            enabled: yes
        - stats:
            totals: yes
            threads: no
            deltas: no

  # Fast log for quick review
  - fast:
      enabled: yes
      filename: fast.log
      append: yes

  # Stats log
  - stats:
      enabled: yes
      filename: stats.log
      append: yes
      totals: yes
      threads: no

# Capture settings
af-packet:
  - interface: eth1
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes
    tpacket-v3: yes
    ring-size: 2048
    block-size: 32768

# Detection engine
detect:
  profile: medium
  custom-values:
    toclient-groups: 3
    toserver-groups: 25
  sgh-mpm-context: auto
  inspection-recursion-limit: 3000

# Stream engine
stream:
  memcap: 64mb
  checksum-validation: yes
  inline: auto
  reassembly:
    memcap: 256mb
    depth: 1mb
    toserver-chunk-size: 2560
    toclient-chunk-size: 2560
    randomize-chunk-size: yes

# App layer protocols
app-layer:
  protocols:
    http:
      enabled: yes
      memcap: 64mb
      body-limit: 100kb
      response-body-limit: 100kb
      request-body-minimal-inspect-size: 32kb
      response-body-minimal-inspect-size: 32kb
    tls:
      enabled: yes
      detection-ports:
        dp: 443
    dns:
      tcp:
        enabled: yes
        detection-ports:
          dp: 53
      udp:
        enabled: yes
        detection-ports:
          dp: 53
    smb:
      enabled: yes
      detection-ports:
        dp: 139, 445
    ftp:
      enabled: yes
    ssh:
      enabled: yes

# Rule files
default-rule-path: /etc/suricata/rules
rule-files:
  - suricata.rules
  - custom-emerging-threats.rules
  - custom-network-anomalies.rules

# Thresholds and rate limiting
threshold-file: /etc/suricata/threshold.config

# Performance
threading:
  set-cpu-affinity: no
  detect-thread-ratio: 1.0

# Logging
logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
    - file:
        enabled: yes
        level: info
        filename: suricata.log
    - syslog:
        enabled: no
        facility: local5
