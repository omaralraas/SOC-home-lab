# SOC Home Lab - Elastic analytics tier (Elasticsearch, Logstash, Kibana 9.5)
#
#   cp .env.example .env && docker compose up -d   ->  http://localhost:5601 (elastic / ELASTIC_PASSWORD)
#
# Single node, security enabled, HTTP without TLS inside the SOC VLAN. The
# one-shot `setup` service sets the kibana_system password and creates a
# least-privilege `logstash_internal` user that can only write the
# logs-soc.* data streams, so Logstash never holds the superuser password.

services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    user: "0"
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
      - LOGSTASH_PASSWORD=${LOGSTASH_PASSWORD}
    volumes:
      - ./setup/setup.sh:/setup.sh:ro
    entrypoint: ["bash", "/setup.sh"]
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    restart: unless-stopped
    environment:
      - node.name=es-node-01
      - cluster.name=soc-homelab
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms${ES_HEAP} -Xmx${ES_HEAP}
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9201:9200"   # 9200 on the host is taken by the Wazuh indexer
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  logstash:
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION}
    restart: unless-stopped
    environment:
      - LOGSTASH_PASSWORD=${LOGSTASH_PASSWORD}
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - XPACK_MONITORING_ENABLED=false
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
    ports:
      - "5044:5044"       # Filebeat: Linux auth/syslog
      - "5045:5045"       # Winlogbeat: Windows Security + Sysmon
      - "5046:5046"       # Filebeat: Suricata eve.json
      - "5514:5514/udp"   # pfSense / network syslog
      - "5514:5514/tcp"
    healthcheck:
      # green once every pipeline (and its inputs) is running
      test: ["CMD-SHELL", "curl -s localhost:9600/_health_report | grep -q '\"status\":\"green\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      setup:
        condition: service_completed_successfully

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - TELEMETRY_OPTIN=false
    volumes:
      - kibana-data:/usr/share/kibana/data
    ports:
      - "5601:5601"
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  elasticsearch-data:
  kibana-data:
