# SOC Home Lab - Syslog Ingestion Pipeline
# Processes: Linux syslog, auth.log, and network device logs

input {
  beats {
    port => 5044
    tags => ["beats-syslog"]
  }
  syslog {
    port => 5514
    tags => ["raw-syslog"]
  }
}

filter {
  # Parse standard syslog format
  grok {
    match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}" }
    add_tag => ["syslog_parsed"]
  }

  # Parse timestamp
  date {
    match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
    target => "@timestamp"
  }

  # Detect SSH authentication events
  if [syslog_program] == "sshd" {
    grok {
      match => { "syslog_message" => [
        "Failed password for %{DATA:ssh_user} from %{IP:src_ip} port %{NUMBER:src_port}",
        "Accepted password for %{DATA:ssh_user} from %{IP:src_ip} port %{NUMBER:src_port}",
        "Failed password for invalid user %{DATA:ssh_user} from %{IP:src_ip} port %{NUMBER:src_port}"
      ]}
      add_tag => ["ssh_auth"]
    }
  }

  # GeoIP enrichment for source IPs
  if [src_ip] {
    geoip {
      source => "src_ip"
      target => "src_geo"
      add_tag => ["geoip_enriched"]
    }
  }

  # Normalize fields to ECS (Elastic Common Schema)
  mutate {
    add_field => {
      "event.module" => "syslog"
      "event.dataset" => "soc.syslog"
      "observer.name" => "soc-homelab"
    }
    rename => {
      "syslog_hostname" => "host.name"
      "syslog_program" => "process.name"
      "syslog_pid" => "process.pid"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "soc-syslog-%{+YYYY.MM.dd}"
    ilm_enabled => true
    ilm_rollover_alias => "soc-syslog"
    ilm_pattern => "{now/d}-000001"
  }
}
