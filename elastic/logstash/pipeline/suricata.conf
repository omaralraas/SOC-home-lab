# SOC Home Lab - Suricata IDS Alert Pipeline
# Processes: Suricata EVE JSON logs (alerts, dns, http, tls, flow)

input {
  file {
    path => "/var/log/suricata/eve.json"
    codec => json
    type => "suricata"
    sincedb_path => "/usr/share/logstash/data/suricata_sincedb"
    start_position => "end"
    tags => ["suricata"]
  }
}

filter {
  # Parse timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }

  # GeoIP enrichment for source IP
  if [src_ip] {
    geoip {
      source => "src_ip"
      target => "src_geo"
      add_tag => ["geoip_src"]
    }
  }

  # GeoIP enrichment for destination IP
  if [dest_ip] {
    geoip {
      source => "dest_ip"
      target => "dest_geo"
      add_tag => ["geoip_dest"]
    }
  }

  # Categorize alert severity
  if [event_type] == "alert" {
    if [alert][severity] == 1 {
      mutate { add_field => { "threat.severity" => "critical" } }
    } else if [alert][severity] == 2 {
      mutate { add_field => { "threat.severity" => "high" } }
    } else if [alert][severity] == 3 {
      mutate { add_field => { "threat.severity" => "medium" } }
    } else {
      mutate { add_field => { "threat.severity" => "low" } }
    }
    mutate { add_tag => ["suricata_alert"] }
  }

  # ECS normalization
  mutate {
    add_field => {
      "event.module" => "suricata"
      "event.dataset" => "soc.suricata"
      "observer.name" => "soc-homelab"
    }
    rename => {
      "src_ip" => "source.ip"
      "src_port" => "source.port"
      "dest_ip" => "destination.ip"
      "dest_port" => "destination.port"
      "proto" => "network.transport"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "soc-suricata-%{+YYYY.MM.dd}"
    ilm_enabled => true
    ilm_rollover_alias => "soc-suricata"
    ilm_pattern => "{now/d}-000001"
  }
}
