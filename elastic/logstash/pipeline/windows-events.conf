# SOC Home Lab - Windows event pipeline -> logs-soc.windows-lab
#
# Input: Winlogbeat on the Windows host (Security, System, Sysmon and
# PowerShell channels). Winlogbeat already emits ECS, so this pipeline only
# adds ATT&CK context for the Security events the hunting queries pivot on.

input {
  beats {
    port => 5045
  }
}

filter {
  if [winlog][channel] == "Security" or [winlog][channel] == "System" {
    translate {
      source => "[event][code]"
      target => "[threat][technique][id]"
      dictionary => {
        "1102" => "T1685.005"
        "4625" => "T1110"
        "4648" => "T1078"
        "4698" => "T1053.005"
        "4720" => "T1136.001"
        "4732" => "T1098"
        "4740" => "T1110"
        "7045" => "T1543.003"
      }
    }
    if [threat][technique][id] {
      mutate { add_field => { "[threat][framework]" => "MITRE ATT&CK" } }
    }
  }

  mutate {
    add_field => { "[observer][name]" => "soc-homelab" }
  }
}

output {
  # Winlogbeat names the ingest pipeline that maps Security/Sysmon events to
  # ECS; forward it so that mapping still runs when shipping via Logstash.
  if [@metadata][pipeline] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "logstash_internal"
      password => "${LOGSTASH_PASSWORD}"
      pipeline => "%{[@metadata][pipeline]}"
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "soc.windows"
      data_stream_namespace => "lab"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "logstash_internal"
      password => "${LOGSTASH_PASSWORD}"
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "soc.windows"
      data_stream_namespace => "lab"
    }
  }
}
