# SOC Home Lab - Windows Event Log Pipeline
# Processes: Security events (4624, 4625, 4688, 4698, 4720, 7045)
# Enriches with MITRE ATT&CK tags and threat severity levels

input {
  beats {
    port => 5045
    tags => ["windows-events"]
  }
}

filter {
  # Parse Windows Security Event IDs and add context
  if [winlog][event_id] {

    # Logon Success (4624)
    if [winlog][event_id] == 4624 {
      mutate {
        add_field => {
          "event.action" => "logon-success"
          "threat.severity" => "informational"
        }
        add_tag => ["authentication", "logon_success"]
      }
    }

    # Logon Failure (4625)
    if [winlog][event_id] == 4625 {
      mutate {
        add_field => {
          "event.action" => "logon-failure"
          "threat.severity" => "low"
          "mitre.technique_id" => "T1110"
          "mitre.technique_name" => "Brute Force"
          "mitre.tactic" => "Credential Access"
        }
        add_tag => ["authentication", "logon_failure", "mitre_tagged"]
      }
    }

    # Explicit Credential Logon (4648)
    if [winlog][event_id] == 4648 {
      mutate {
        add_field => {
          "event.action" => "explicit-credential-logon"
          "threat.severity" => "medium"
          "mitre.technique_id" => "T1078"
          "mitre.technique_name" => "Valid Accounts"
          "mitre.tactic" => "Defense Evasion"
        }
        add_tag => ["authentication", "explicit_creds", "mitre_tagged"]
      }
    }

    # Process Creation (4688)
    if [winlog][event_id] == 4688 {
      mutate {
        add_field => {
          "event.action" => "process-creation"
          "threat.severity" => "informational"
          "mitre.technique_id" => "T1059"
          "mitre.technique_name" => "Command and Scripting Interpreter"
          "mitre.tactic" => "Execution"
        }
        add_tag => ["process", "process_creation", "mitre_tagged"]
      }
    }

    # Scheduled Task Created (4698)
    if [winlog][event_id] == 4698 {
      mutate {
        add_field => {
          "event.action" => "scheduled-task-created"
          "threat.severity" => "medium"
          "mitre.technique_id" => "T1053.005"
          "mitre.technique_name" => "Scheduled Task"
          "mitre.tactic" => "Persistence"
        }
        add_tag => ["persistence", "scheduled_task", "mitre_tagged"]
      }
    }

    # User Account Created (4720)
    if [winlog][event_id] == 4720 {
      mutate {
        add_field => {
          "event.action" => "user-account-created"
          "threat.severity" => "medium"
          "mitre.technique_id" => "T1136.001"
          "mitre.technique_name" => "Create Account - Local"
          "mitre.tactic" => "Persistence"
        }
        add_tag => ["persistence", "account_creation", "mitre_tagged"]
      }
    }

    # Service Installed (7045)
    if [winlog][event_id] == 7045 {
      mutate {
        add_field => {
          "event.action" => "service-installed"
          "threat.severity" => "high"
          "mitre.technique_id" => "T1543.003"
          "mitre.technique_name" => "Windows Service"
          "mitre.tactic" => "Persistence"
        }
        add_tag => ["persistence", "service_install", "mitre_tagged"]
      }
    }
  }

  # ECS normalization
  mutate {
    add_field => {
      "event.module" => "windows"
      "event.dataset" => "soc.windows-security"
      "observer.name" => "soc-homelab"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "soc-windows-%{+YYYY.MM.dd}"
    ilm_enabled => true
    ilm_rollover_alias => "soc-windows"
    ilm_pattern => "{now/d}-000001"
  }
}
