# One Logstash pipeline per source; each writes its own logs-soc.<source>-lab data stream.
- pipeline.id: syslog
  path.config: "/usr/share/logstash/pipeline/syslog.conf"
- pipeline.id: windows
  path.config: "/usr/share/logstash/pipeline/windows-events.conf"
- pipeline.id: suricata
  path.config: "/usr/share/logstash/pipeline/suricata.conf"
