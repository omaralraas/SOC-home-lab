[project]
name = "soc-home-lab"
version = "2.0.0"
description = "Detection-as-code SOC lab: Wazuh, Suricata, Sigma and YARA detections tested in CI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "docker: needs a Docker daemon (starts Wazuh / Suricata containers)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# subprocess calls to the docker CLI and asserts are the point of the tests
"tests/**" = ["S101", "S603", "S607"]
