title: DNS Query with an Oversized Encoded Label
id: e6f7a8b9-0c1d-2e3f-4a5b-6c7d8e9f0123
status: test
description: |
  Detects DNS queries whose first label is 45-63 characters of letters and
  digits, the shape produced when tools such as dnscat2 and iodine encode data
  into subdomains, plus dnscat2's default domain prefix. Large CDN and
  platform domains that legitimately use long hashed labels are filtered.
  Per-query detection only: volume-based tunnelling is covered by Suricata
  SID 1000003 and the beacon hunter in scripts/threat-hunting.
references:
  - https://attack.mitre.org/techniques/T1071/004/
  - https://attack.mitre.org/techniques/T1048/003/
  - https://github.com/iagox86/dnscat2
author: Omar Alraas
date: 2025-01-25
modified: 2026-10-25
tags:
  - attack.command-and-control
  - attack.t1071.004
  - attack.exfiltration
  - attack.t1048.003
logsource:
  category: dns
detection:
  selection_long_label:
    query|re: '^[A-Za-z0-9-]{45,63}\.'
  selection_dnscat:
    query|startswith: 'dnscat.'
  filter_platforms:
    query|endswith:
      - '.amazonaws.com'
      - '.cloudfront.net'
      - '.akamaiedge.net'
      - '.windowsupdate.com'
      - '.microsoft.com'
      - '.googleusercontent.com'
  condition: (selection_long_label or selection_dnscat) and not filter_platforms
falsepositives:
  - Anti-virus and reputation services that look up file hashes over DNS
  - Other SaaS platforms using long hashed hostnames (extend filter_platforms)
level: high
