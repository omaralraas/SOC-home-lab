title: Suspicious Sudo Usage - Privilege Escalation
id: d5e6f7a8-9b0c-1d2e-3f4a-5b6c7d8e9f01
status: experimental
description: |
  Detects unusual sudo usage patterns that may indicate privilege escalation
  attempts or abuse of sudo misconfigurations.
author: Omar Alraas
date: 2025/01/25
references:
  - https://attack.mitre.org/techniques/T1548/003/
tags:
  - attack.privilege_escalation
  - attack.t1548.003
logsource:
  product: linux
  service: auth
detection:
  selection_sudo_abuse:
    - message|contains:
        - 'sudo:'
        - 'COMMAND='
    - message|contains:
        - '/bin/bash'
        - '/bin/sh'
        - 'chmod +s'
        - 'chown root'
        - 'passwd'
        - 'visudo'
        - '/etc/shadow'
        - 'NOPASSWD'
  selection_sudo_failure:
    message|contains:
      - 'incorrect password attempt'
      - 'NOT in sudoers'
      - 'authentication failure'
  condition: selection_sudo_abuse or selection_sudo_failure
falsepositives:
  - Legitimate system administration
  - Automated configuration management tools (Ansible, Puppet)
level: medium
