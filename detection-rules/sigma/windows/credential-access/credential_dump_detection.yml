title: Credential Dumping Tool Execution
id: 8f2c3d71-a4b5-4e67-8c91-2d3f5a6b7890
status: stable
description: |
  Detects execution of credential dumping tools through process name matching,
  command-line argument patterns, and known tool signatures. Covers multiple
  detection vectors for defense-in-depth.
author: Omar Alraas
date: 2025/01/15
modified: 2025/02/01
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1003/
tags:
  - attack.credential_access
  - attack.t1003.001
  - attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  # Detection by command-line arguments
  selection_cmdline:
    CommandLine|contains:
      - 'sekurlsa'
      - 'kerberos::list'
      - 'crypto::certificates'
      - 'lsadump::sam'
      - 'lsadump::dcsync'
      - 'privilege::debug'
      - 'token::elevate'
      - 'vault::cred'
  # Detection by process name patterns
  selection_process:
    Image|endswith:
      - '\procdump.exe'
      - '\procdump64.exe'
    CommandLine|contains:
      - 'lsass'
  # Detection by known tool hashes (SHA256)
  selection_hash:
    Hashes|contains:
      - 'SHA256=E930B05DCEF96DE88BD66E3439CF2B143B05AE49A0DCA3F1CE6A2A4FB7D08454'
  condition: selection_cmdline or selection_process or selection_hash
falsepositives:
  - Legitimate penetration testing with authorization
  - Security tool debugging by IT administrators
level: critical
