title: LSASS Credential Dumping via Command Line
id: 8f2c3d71-a4b5-4e67-8c91-2d3f5a6b7890
status: test
description: |
  Detects LSASS credential dumping from the command line: Mimikatz module
  syntax, ProcDump targeting lsass, or the comsvcs.dll MiniDump export run
  through rundll32. Matches on arguments rather than file names, so renamed
  binaries are still caught.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://lolbas-project.github.io/lolbas/Libraries/Comsvcs/
author: Omar Alraas
date: 2025-01-15
modified: 2026-10-25
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_mimikatz:
    CommandLine|contains:
      - 'sekurlsa::'
      - 'lsadump::'
      - 'kerberos::list'
      - 'kerberos::golden'
      - 'privilege::debug'
      - 'token::elevate'
      - 'vault::cred'
      - 'dpapi::'
  selection_procdump_image:
    - Image|endswith:
        - '\procdump.exe'
        - '\procdump64.exe'
    - OriginalFileName|startswith: 'procdump'
  selection_procdump_target:
    CommandLine|contains: 'lsass'
  selection_comsvcs_dll:
    CommandLine|contains: 'comsvcs'
  selection_comsvcs_export:
    CommandLine|contains:
      - 'MiniDump'
      - '#24'
      - '#+24'
  condition: >-
    selection_mimikatz
    or (selection_procdump_image and selection_procdump_target)
    or (selection_comsvcs_dll and selection_comsvcs_export)
falsepositives:
  - Authorized penetration tests or red-team exercises
  - Administrators capturing an LSASS dump for a vendor support case (should be ticketed)
level: critical
