title: Windows Defender Tampering
id: c4d5e6f7-8a9b-0c1d-2e3f-4a5b6c7d8e9f
status: stable
description: |
  Detects attempts to disable or tamper with Windows Defender through registry
  modifications, PowerShell commands, or service manipulation.
author: Omar Alraas
date: 2025/01/20
references:
  - https://attack.mitre.org/techniques/T1562/001/
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_powershell:
    CommandLine|contains:
      - 'Set-MpPreference -DisableRealtimeMonitoring'
      - 'Set-MpPreference -DisableBehaviorMonitoring'
      - 'Set-MpPreference -DisableBlockAtFirstSeen'
      - 'Set-MpPreference -DisableIOAVProtection'
      - 'Set-MpPreference -DisableScriptScanning'
  selection_registry:
    CommandLine|contains:
      - 'DisableAntiSpyware'
      - 'DisableRealtimeMonitoring'
  selection_service:
    CommandLine|contains:
      - 'sc stop WinDefend'
      - 'sc config WinDefend start= disabled'
      - 'net stop WinDefend'
  condition: selection_powershell or selection_registry or selection_service
falsepositives:
  - Legitimate security software conflict resolution
  - IT administrator temporarily disabling for troubleshooting
level: high
