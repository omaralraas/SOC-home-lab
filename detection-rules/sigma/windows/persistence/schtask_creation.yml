title: Scheduled Task Created with a Script Host or User-Writable Action
id: 3a6b14c7-9f8e-4d2a-b5c1-e7f3a9d80123
status: test
description: |
  Detects scheduled tasks (Security event 4698) whose action runs a script
  host or LOLBin, or a binary from a user-writable folder. It keys on what
  the task executes rather than its name, since attackers name tasks after
  updaters and every browser ships a real "Update" task.
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4698
author: Omar Alraas
date: 2025-01-15
modified: 2026-10-25
tags:
  - attack.execution
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.005
logsource:
  product: windows
  service: security
  definition: 'Requirements: Audit Other Object Access Events must be enabled'
detection:
  selection:
    EventID: 4698
  selection_action:
    TaskContent|contains:
      - '\AppData\'
      - '\Users\Public\'
      - '\Windows\Temp\'
      - 'powershell'
      - 'pwsh'
      - 'mshta'
      - 'wscript'
      - 'cscript'
      - 'rundll32'
      - 'regsvr32'
      - 'cmd.exe /c'
      - 'cmd /c'
  filter_microsoft:
    TaskName|startswith: '\Microsoft\'
  condition: selection and selection_action and not filter_microsoft
falsepositives:
  - Administrative scripts scheduled through PowerShell (allow-list by TaskName)
  - Per-user application updaters installed under AppData (e.g. Teams, Zoom)
level: medium
