title: Microsoft Defender Disabled or Excluded via Command Line
id: c4d5e6f7-8a9b-0c1d-2e3f-4a5b6c7d8e9f
status: test
description: |
  Detects Defender protections being switched off, or bypassed with
  exclusions, through Set-MpPreference / Add-MpPreference, the service control
  manager, or the DisableAntiSpyware policy value. Cmdlet and parameter are
  matched independently, so reordering arguments does not evade the rule, and
  explicitly re-enabling a protection ($false) is not flagged.
references:
  - https://attack.mitre.org/techniques/T1685/
  - https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference
author: Omar Alraas
date: 2025-01-20
modified: 2026-10-25
tags:
  - attack.defense-impairment
  - attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection_mppref_cmdlet:
    CommandLine|contains: 'Set-MpPreference'
  selection_mppref_disable:
    CommandLine|contains:
      - '-DisableRealtimeMonitoring'
      - '-DisableBehaviorMonitoring'
      - '-DisableBlockAtFirstSeen'
      - '-DisableIOAVProtection'
      - '-DisableScriptScanning'
      - '-DisableIntrusionPreventionSystem'
      - '-DisableArchiveScanning'
  filter_mppref_reenable:
    CommandLine|contains: '$false'
  selection_exclusion:
    CommandLine|contains|all:
      - 'Add-MpPreference'
      - '-Exclusion'
  selection_service_image:
    Image|endswith:
      - '\sc.exe'
      - '\net.exe'
      - '\net1.exe'
  selection_service_target:
    CommandLine|contains: 'WinDefend'
  selection_service_action:
    CommandLine|contains:
      - ' stop'
      - 'disabled'
      - ' delete'
  selection_policy:
    CommandLine|contains: 'DisableAntiSpyware'
  condition: >-
    (selection_mppref_cmdlet and selection_mppref_disable and not filter_mppref_reenable)
    or selection_exclusion
    or (selection_service_image and selection_service_target and selection_service_action)
    or selection_policy
falsepositives:
  - IT troubleshooting a conflict with third-party AV (should be ticketed and short-lived)
  - Software installers adding Defender exclusions for their own install folder
level: high
